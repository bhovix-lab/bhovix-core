# Weekly update pull requests (free, also for private repositories). Actions stay pinned to commit SHAs; Dependabot
# keeps the pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
